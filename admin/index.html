<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BODYBOX Admin</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
:root{--bg:#111111;--panel:#1B1B1B;--panel2:#151515;--line:#2A2A2A;--chalk:#F4F2EE;--muted:#8F8B84;--red:#C8102E;--red2:#FF5A64;--gold:#E8B44C;--green:#6FBF73;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;--cond:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--chalk);font:15px/1.45 var(--body)}
a{color:var(--red2)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red2);outline-offset:1px}
.btn{background:var(--red);border:0;border-radius:999px;color:#fff;font-weight:600;padding:8px 16px;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .card{width:100%;max-width:380px;display:grid;gap:14px}
#gate h1{font:400 34px/1 var(--display);text-align:center;margin:0;letter-spacing:.03em}#gate h1 span{color:var(--red2)}
#gate p{margin:0;text-align:center;color:var(--muted)}
#gate label{display:grid;gap:4px;font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#gate input{padding:12px 14px;border-radius:12px;background:var(--panel)}
#gate .btn{padding:13px;font-size:16px}
#gate .err{color:#ff8a7a;text-align:center;min-height:1.2em;font-size:14px}
/* top */
header.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(17,17,17,.96);backdrop-filter:blur(6px);z-index:20}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--display);letter-spacing:.03em}.brand span{color:var(--red2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-radius:999px;padding:7px 14px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
main{padding:22px 0 60px}
h2{font:400 30px/1.1 var(--display);margin:0 0 4px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;text-align:left}
button.stat:hover{border-color:#444}
.stat b{font:700 26px var(--mono)}.stat span{font-size:13px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:#111}
.chips button i{font-style:normal;opacity:.7;margin-left:4px}
.search{flex:1;min-width:180px;max-width:320px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--red);border-radius:12px;padding:8px 12px;margin:0 0 12px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 300px);min-height:300px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--panel);z-index:2;font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--chalk)}th .ar{color:var(--red2)}
tr:hover td{background:#161616}
td.nm b{display:block;font-size:15px}td.nm small{color:var(--muted);font-size:12px;display:block;word-break:break-all}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--line);color:var(--gold);margin-top:3px}
.acc{font-weight:600;font-size:13px}.acc.on{color:var(--green)}.acc.wait{color:var(--gold)}.acc.off{color:var(--red2)}
.progs{display:flex;flex-wrap:wrap;gap:4px;max-width:440px}
.progs button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
.progs button.on{background:var(--red);border-color:var(--red);color:#fff}
.progs span{font-size:12px;color:var(--gold);padding:3px 0}
.pst{font-weight:600;font-size:13px;white-space:nowrap}.pst.ok{color:var(--green)}.pst.due{color:var(--gold)}.pst.late{color:var(--red2)}.pst.none{color:var(--muted)}.pst.free{color:#C9C5BE}
td input.rate{width:74px}td input.pt{width:142px}td input.note{width:100%;min-width:170px}
td.act{white-space:nowrap}td.act .btn{margin:0 4px 4px 0}
.saved{color:var(--green);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.seg{display:flex;gap:6px}.seg button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2);display:grid;gap:4px}
.item b{font-size:16px}.item small{color:var(--muted)}
.item .acts{display:flex;gap:6px;margin-top:4px}
h3{font:700 13px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--chalk);color:#111;border-radius:999px;padding:10px 18px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.note{font-size:13px;color:var(--muted);margin:0}
/* calendar (like the SugarWOD whiteboard calendar) */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 12px}
.calbar .wk{font:700 16px var(--body);min-width:190px;text-align:center}
.tracks{display:flex;gap:6px;flex-wrap:wrap}
.tracks button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--muted)}
.tracks button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));min-width:1330px}
.cday{border-right:1px solid var(--line);min-height:460px;display:flex;flex-direction:column}
.cday:last-child{border-right:0}
.cday .dh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.cday .dh b{font:700 13px var(--cond);letter-spacing:.1em;text-transform:uppercase}.cday .dh span{font:700 18px var(--mono)}
.cday.today .dh{background:#2a1015}.cday.today .dh span{color:var(--red2)}
.cday.past{opacity:.72}
.wcard{margin:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px;cursor:pointer;display:grid;gap:8px;text-align:left;width:calc(100% - 16px);font-size:13px;line-height:1.45}
.wcard:hover{border-color:#555}
.wcard .wt{font-weight:700;font-size:14px;line-height:1.3}
.wcard .pt{display:grid;gap:1px}
.wcard .tg{font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red2)}
.wcard .ln{color:#D9D5CD;white-space:pre-wrap;word-break:break-word}
.wcard .ln.h{font-weight:700;color:var(--chalk)}.wcard .ln.r{color:var(--muted)}.wcard .ln.sc{color:var(--gold)}
.wcard .more{color:var(--muted);font-size:12px}
.cempty{color:var(--muted);font-size:13px;padding:14px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:680px;width:100%;padding:20px 22px;display:grid;gap:14px}
.modal h2{font-size:26px}
.modal .pt{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.modal .tg{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red2);margin-bottom:4px}
.modal .ln{white-space:pre-wrap}.modal .ln.h{font-weight:700;font-size:16px}.modal .ln.r{color:var(--muted)}.modal .ln.sc{color:var(--gold)}
.nbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:14px}
.nbox.co{border-color:rgba(232,180,76,.5)}
.nbox h4{margin:0;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nbox.co h4{color:var(--gold)}
.tmr{font-size:13px;color:var(--muted)}
.flyers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
</style>
</head>
<body>
<div id="gate"><div class="card"><div class="gspin label" style="text-align:center">Loading…</div></div></div>
<div id="appRoot" hidden>
  <header class="top"><div class="wrap">
    <div class="brand">BODY<span>BOX</span> ADMIN</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
      <button role="tab" data-tab="members" aria-selected="true">Athletes &amp; payments</button>
      <button role="tab" data-tab="invite" aria-selected="false">New athlete</button>
      <button role="tab" data-tab="events" aria-selected="false">Events &amp; news</button>
      <button role="tab" data-tab="challenges" aria-selected="false">Challenges</button>
      <button role="tab" data-tab="prices" aria-selected="false">Price sheet</button>
    </nav>
    <div class="who"><span id="whoName"></span><a href="../app2/" class="btn ghost sm" style="text-decoration:none">Open the app</a><button class="btn ghost sm" id="outBtn" type="button">Sign out</button></div>
  </div></header>
  <main><div class="wrap" id="view"></div></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, onSnapshot, collectionGroup, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg = { apiKey: "AIzaSyAMHdGXPgAwPkbdGdcmA538JHBAF_QWAEU", authDomain: "teambodybox-app.firebaseapp.com", projectId: "teambodybox-app", storageBucket: "teambodybox-app.firebasestorage.app", messagingSenderId: "212485533701", appId: "1:212485533701:web:a42605f3fdf0ad6b60ec6c" };
const fb = initializeApp(cfg), auth = getAuth(fb), fs = getFirestore(fb);
setPersistence(auth, browserLocalPersistence).catch(() => {});

// same lists as the app
const COACHES = ['reefwtraining@gmail.com'];
const PROGS = [['comp','Athlete Comp'],['build','Building'],['cardio','Cardio'],['shiit','S.H.I.I.T'],['rt','RT Movement'],['garage','Garage Box'],['yoga','Yoga & Toning']];
const PERSONAL = ['personal','Personal'];
const PLANS = { comp:'Athlete Comp', build:'Body Box Building', cardio:'Cardio', garage:'Garage Box', all3:'All 3 Programs', coach:'Personal Coaching', staff:'Coach access' };
const PLAN_PROGS = { comp:['comp'], build:['build'], cardio:['cardio'], garage:['garage'], all3:['comp','build','cardio'], coach:['comp','build','cardio'] };
const PRICE_DEFAULT = 'BODYBOX prices (per month)\n- One program (Athlete Comp, Body Box Building or Cardio): $35\n- All 3 programs: $69\n- All 3 programs + personal programming from Coach Reef: $129\n- Garage Box: $25\nPayment is due on the 1st of every month. If it isn\'t in by 7:59 PM on the 1st, your programming pauses. Pay by the 5th and it comes right back.\nPayments and account questions: message Jameson in the app chat or email teambodybox@gmail.com';

const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0'), ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), today = () => ymd(new Date());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = ds => { if(!ds) return ''; const [y,m,d] = ds.split('-').map(Number); return MON[m-1]+' '+d+(y !== new Date().getFullYear() ? ', '+y : ''); };
const addMonth = ds => { const [y,m,d] = ds.split('-').map(Number); return ymd(new Date(y, m, d)); };
const addDays = (ds, n) => { const [y,m,d] = ds.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); };
const firstOfMonth = ds => ds.slice(0,8)+'01';
const dayDiff = (a, b) => Math.round((new Date(a+'T12:00:00') - new Date(b+'T12:00:00')) / 864e5);
function payState(b){
  const pt = b && b.paidThrough, td = today();
  if(b && String(b.rate) === '0') return { k:'free', t:'No charge' };
  if(b && b.plan === 'sessions') return { k:'free', t:'Paid with Coach Reef sessions' };
  if(!pt) return { k:'none', t:'Not set up' };
  if(pt > td) return { k:'ok', t:'Paid through '+fmtD(pt) };
  const late = dayDiff(td, pt);
  if(late < 5) return { k:'due', t:'Due '+fmtD(pt)+(late ? ' · '+late+'d late' : ' · today') };
  return { k:'late', t:'Not paid since '+fmtD(pt) };
}
let toastT; function toast(t){ let el = $('.toast'); if(!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

/* ---------- gate ---------- */
const gate = h => { $('#gate').hidden = false; $('#appRoot').hidden = true; $('#gate .card').innerHTML = '<h1>BODY<span>BOX</span> ADMIN</h1>'+h; };
function showSignIn(msg){
  gate('<p>For Coach Reef and BODYBOX admins. Use your BODYBOX app login.</p>'+
    '<form id="gIn" class="card" style="gap:12px"><label>Email<input id="gEm" type="email" autocomplete="email" required></label><label>Password<input id="gPw" type="password" autocomplete="current-password" required></label>'+
    '<p class="err" id="gErr">'+esc(msg||'')+'</p><button class="btn" type="submit">Sign in</button></form><p><button type="button" id="gForgot" style="background:none;border:0;color:var(--red2);text-decoration:underline">Forgot password</button></p>');
  $('#gIn').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try{ await signInWithEmailAndPassword(auth, $('#gEm').value.trim(), $('#gPw').value); }
    catch(x){ $('#gErr').textContent = /network/.test(x.code||'') ? 'No connection. Try again.' : 'That email and password don\'t match.'; b.disabled = false; } };
  $('#gForgot').onclick = async () => { const em = $('#gEm').value.trim(); if(!em){ $('#gErr').textContent = 'Type your email, then tap Forgot password.'; return; } try{ await sendPasswordResetEmail(auth, em); $('#gErr').textContent = 'Check your email for a reset link.'; }catch(x){ $('#gErr').textContent = 'Couldn\'t send it. Check the email.'; } };
}
let ME = null, IS_COACH = false;
onAuthStateChanged(auth, async u => {
  if(!u){ showSignIn(''); return; }
  gate('<p>Checking your access…</p>');
  IS_COACH = COACHES.includes((u.email||'').toLowerCase());
  let md = {}; try{ const s = await getDoc(doc(fs, 'members', u.uid)); md = s.exists() ? s.data() : {}; }catch(e){}
  if(!IS_COACH && !(md.admin && md.approved)){ gate('<p>This page is for BODYBOX staff only. You\'re signed in as '+esc(u.email)+'.</p><button class="btn ghost" id="gOut">Sign out</button>'); $('#gOut').onclick = () => signOut(auth); return; }
  ME = { uid: u.uid, name: md.name || u.displayName || (IS_COACH ? 'Coach Reef' : 'Admin'), badge: md.coachBadge || '' };
  $('#whoName').textContent = ME.name + (IS_COACH ? ' · Head Coach' : ' · Admin');
  $('#gate').hidden = true; $('#appRoot').hidden = false;
  $('#outBtn').onclick = () => signOut(auth);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  live(); go(IS_COACH ? 'calendar' : 'members');
});

/* ---------- live data ---------- */
const D = { members: [], bill: {}, posts: [], going: {}, ch: [], inv: [] };
let TAB = 'members', redrawT;
const redraw = () => { clearTimeout(redrawT); redrawT = setTimeout(() => { if(!busyTyping()) render(); }, 120); };
const busyTyping = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#view') && !a.matches('.search'); };
function live(){
  onSnapshot(collection(fs, 'members'), s => { D.members = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if(TAB !== 'calendar') redraw(); }, e => console.warn(e));
  onSnapshot(collection(fs, 'billing'), s => { D.bill = {}; s.docs.forEach(d => D.bill[d.id] = d.data()); if(TAB !== 'calendar') redraw(); }, e => console.warn(e));
  onSnapshot(collection(fs, 'posts'), s => { D.posts = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if(TAB === 'events') redraw(); }, () => {});
  onSnapshot(collectionGroup(fs, 'going'), s => { const G = {}; s.docs.forEach(d => { const k = d.ref.parent.parent.id; (G[k] = G[k] || []).push(Object.assign({ uid: d.id }, d.data())); }); D.going = G; if(TAB === 'events') redraw(); }, () => {});
  onSnapshot(collection(fs, 'invites'), s => { D.inv = s.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(i => i.email && Array.isArray(i.progs)); if(TAB === 'invite' || TAB === 'members') redraw(); }, () => {});
  onSnapshot(collection(fs, 'challenges'), s => { D.ch = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if(TAB === 'challenges') redraw(); }, () => {});
}
function go(t){ TAB = t; document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t))); render(); }
function render(){ ({ invite: renderInvite, calendar: renderCal, members: renderMembers, events: renderEvents, challenges: renderCh, prices: renderPrices })[TAB](); }

/* ---------- calendar: the week's programming per track, like SugarWOD ---------- */
const TRACKS = [['class','RT Movement','VXW86K','rt'],['comp','Athlete Comp','WGC534','comp'],['build','Building','RMXGZJ','build'],['cardio','Cardio','WQH7V7','cardio'],['garage','Garage Box','ZUBVXM','garage'],['shiit','S.H.I.I.T','56EG63','shiit'],['yoga','Yoga & Toning','GN83T7','yoga']];
const CAL = { track: 'class', mon: null, mem: null, loading: false, err: '', notes: {} };
const mondayOf = ds => { const [y,m,d] = ds.split('-').map(Number), t = new Date(y, m-1, d); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return ymd(t); };
const b64d = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function readContent(name){ const s = await getDoc(doc(fs, 'content', name)); if(!s.exists()) return null; const d = s.data(); if(!d.parts) return d.json;
  const ps = await Promise.all(Array.from({ length: d.parts }, (_, i) => getDoc(doc(fs, 'content', name + '_' + (i+1))))); return (d.json||'') + ps.map(x => x.exists() ? (x.data().json || '') : '').join(''); }
async function loadProgramming(){
  CAL.loading = true; CAL.err = '';
  try{
    const LB = JSON.parse(await readContent('lb') || '{}'), enc = LB.enc || {}, M = {};
    await Promise.all(TRACKS.map(async ([k, , code, slot]) => { const sl = (enc.slots||{})[slot]; if(!sl) return;
      try{ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: b64d(sl.salt), iterations: enc.iter || 150000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);

  { name:'Yoga & Toning flyer', png:'yoga-toning-prices.png', pdf:'yoga-toning-prices.pdf', dl:'Yoga-Toning-Flyer', desc:'Yoga & Toning classes at Rebuilt with Lead Coach Monalisa: unlimited $129, 8 a month $99, 4 a month $59, drop-in $20 ($10 members), $40 member add-on, first month $59.' },
  { name:'Train With Reef flyer', png:'train-with-reef.png', pdf:'', dl:'Train-With-Reef-Flyer', desc:'In-person coaching with Coach Reef at Rebuilt: 1:1 $170, 2:1 $105 each, 3:1 $85 each per session, plus remote and programs prices.' }
];
function renderPrices(){
  const P = D.bill._prices || {}, c = payCfg(P);
  $('#view').innerHTML = '<h2>Price sheet &amp; how to pay</h2><p class="note">"Prices" sends this sheet to an athlete in their app chat, with the ways to pay added at the end. Payment reminders include a Venmo link with their amount already filled in.</p>'+
    '<div class="grid2" style="margin-top:16px"><div class="panel form"><b>Price sheet</b><textarea id="prText" rows="12" maxlength="600">'+esc((P.text) || PRICE_DEFAULT)+'</textarea><small class="muted" id="prLeft"></small></div>'+
    '<div class="panel form"><b>How athletes pay</b><label>Venmo username<input id="pyV" maxlength="40" value="'+esc(c.venmo)+'" placeholder="teambodybox"></label>'+
    '<label>Other ways to pay (one line, shows under the Venmo link)<input id="pyO" maxlength="120" value="'+esc(c.other)+'" placeholder="Apple Pay: ask teambodybox@gmail.com"></label>'+
    '<p class="note" id="pyTest"></p><div><button class="btn" id="prSave" type="button">Save</button></div>'+
    '<b style="margin-top:8px">What athletes get</b><div id="prPrev" style="white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px"></div></div></div>'+
    '<h3 style="margin-top:22px">Price flyers</h3><div class="flyers">'+FLYERS.map((f, i) => '<div class="panel" style="align-content:start"><a href="../img/'+f.png+'" target="_blank" rel="noopener"><img src="../img/'+f.png+'" alt="'+esc(f.name)+'" style="width:100%;border-radius:10px;border:1px solid var(--line);display:block"></a>'+
      '<b>'+esc(f.name)+'</b><p class="note">'+esc(f.desc)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sm" href="../img/'+f.png+'" download="'+f.dl+'.png" style="text-decoration:none">Download picture</a>'+(f.pdf ? '<a class="btn ghost sm" href="../img/'+f.pdf+'" download="'+f.dl+'.pdf" style="text-decoration:none">PDF to print</a>' : '')+'<button class="btn ghost sm" type="button" data-flink="'+i+'">Copy link</button></div></div>').join('')+'</div>';
  const t = $('#prText'), cur = () => ({ text: t.value, venmo: $('#pyV').value.replace(/^@/, '').trim(), other: $('#pyO').value.trim() });
  const upd = () => { const C = cur(), full = priceMsg(C, C.text); $('#prLeft').textContent = Math.max(0, 600 - (C.text + (C.venmo ? '\nVenmo: https://venmo.com/u/'+C.venmo : '') + (C.other ? '\n'+C.other : '')).length)+' characters left (with the pay lines)'; $('#prPrev').textContent = full;
    const l = payLink(C, { rate: 30 }, 'Ashley'); $('#pyTest').innerHTML = l ? 'Test the Venmo link (a $30 example): <a href="'+esc(l)+'" target="_blank" rel="noopener">open</a>' : 'No Venmo username: reminders go out without a pay link.'; };
  [t, $('#pyV'), $('#pyO')].forEach(x => x.oninput = upd); upd();
  document.querySelectorAll('[data-flink]').forEach(b => b.onclick = async () => { const l = 'https://reefwtraining.github.io/bodybox/img/'+FLYERS[+b.dataset.flink].png; try{ await navigator.clipboard.writeText(l); toast('Link copied'); }catch(e){ prompt('Copy this link:', l); } });
  $('#prSave').onclick = async () => { const C = cur();
    try{ await setDoc(doc(fs,'billing','_prices'), { text: C.text.slice(0,600), venmo: C.venmo, other: C.other.slice(0,120), by: ME.name, at: serverTimestamp() }); toast('Saved'); }catch(e){ alert('Couldn\'t save.'); } };
}
</script>
</body>
