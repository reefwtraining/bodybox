<style>
/* VOICE: a clean music app, calm chrome so the songs lead
   IDEA: a streaming app's library: sidebar, album headers, track lists, mini player
   PICTURE: square playlist artwork built from the cassette logo, one tint per playlist
   COLOUR and TYPE: white or black ground, grey text, BODYBOX red accent; Inter, Anton on artwork only
   LAYOUT: sidebar + content on wide screens; top tabs and bottom player on phones */
:root{color-scheme:dark;--bg:#111111;--side:#161616;--ink:#F4F2EE;--sub:#8F8B84;--line:#2A2A2A;--hover:#1F1F1F;--acc:#FF5A64;--red:#C8102E;--bar:rgba(17,17,17,.92);--display:"Anton",Impact,"Arial Narrow",sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;--cond:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.row:focus-visible,.tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px 120px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:15px var(--body);color:var(--ink);margin-bottom:14px}
.nav h4{font-size:11px;font-weight:600;color:var(--sub);margin:16px 8px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:14px;min-height:36px}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);color:var(--acc);font-weight:600}
.nav i{width:22px;height:22px;border-radius:5px;flex:none;background-size:cover}
main{padding:28px clamp(16px,4vw,44px) 140px}
.top{display:none}
h1{font-size:clamp(28px,4vw,34px);font-weight:800;letter-spacing:-.6px;margin:0 0 18px}
h3{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:28px 0 12px}
.hero{border-radius:14px;overflow:hidden;margin-bottom:6px;background:#0b0b0b}
.hero img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,180px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.tile{text-align:left;scroll-snap-align:start}
.tile .art{width:100%;aspect-ratio:1;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tile .t{font-size:14px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:13px;color:var(--sub)}
.art{position:relative;overflow:hidden;background:#111;display:block}
.art::before{content:"";position:absolute;inset:0;background:var(--g)}
.art img{position:absolute;left:14%;top:12%;width:72%;height:auto;opacity:.9;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.art span{position:absolute;left:9%;right:9%;bottom:8%;font-family:Anton,Impact,sans-serif;color:#fff;text-transform:uppercase;line-height:.95;font-size:clamp(16px,2.2vw,22px);text-shadow:0 2px 10px rgba(0,0,0,.35)}
.art em{display:none}
.head{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:22px}
.head .art{width:100%;aspect-ratio:1;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.head .art span{font-size:clamp(22px,3vw,30px)}
.head h2{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.6px;margin:0;line-height:1.1}
.head .by{color:var(--acc);font-size:clamp(18px,2.4vw,22px);font-weight:500;margin:2px 0 6px}
.head .meta{color:var(--sub);font-size:13px}
.head .note{color:var(--sub);font-size:14px;margin:10px 0 16px;max-width:60ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border-radius:9px;padding:0 22px;min-height:40px;font-weight:600;font-size:15px}
.pill.alt{background:var(--hover);color:var(--acc)}
.pill svg{width:13px;height:13px;fill:currentColor}
.jump{margin-top:12px;font-size:14px;color:var(--acc);font-weight:600;min-height:36px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:hover{background:var(--hover)}
.row .n{color:var(--sub);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.row .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .u{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
.row.on .tt{color:var(--acc);font-weight:600}
.th{width:42px;height:42px;border-radius:5px;flex:none}.th img{left:8%;top:22%;width:84%}.art.photo::before{display:none}.art.photo img{left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:1;filter:none}.sec{font-size:12px;font-weight:600;color:var(--sub);padding:18px 8px 6px;border-bottom:1px solid var(--line)}
.eq{display:inline-flex;gap:2px;height:14px;align-items:flex-end}
.eq i{width:3px;background:var(--acc);border-radius:1px;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}
.empty{color:var(--sub);padding:30px 8px}
.about{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:center;margin-top:34px;padding:20px;border-radius:14px;background:var(--side)}.about img{width:100%;border-radius:12px}.about h3{margin:0 0 8px}.about p{margin:0 0 8px;color:var(--sub);max-width:60ch}.about .kdgt{color:var(--acc);font-weight:700}@media(max-width:600px){.about{grid-template-columns:minmax(0,1fr);text-align:center}.about img{max-width:180px;margin:0 auto}}.foot{color:var(--sub);font-size:12px;margin-top:30px;line-height:1.5;max-width:70ch}
.player{position:fixed;left:240px;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:10px clamp(12px,3vw,28px);display:none;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.player.on{display:grid}
.np{display:flex;gap:12px;align-items:center}
.np .art{width:48px;height:48px;border-radius:6px;flex:none}
.np .art span,.np .art em{display:none}.np .art img{left:8%;top:22%;width:84%}.np .art.photo img{left:0;top:0;width:100%;height:100%}
.np .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ctl button:hover{background:var(--hover)}
.ctl svg{width:20px;height:20px;fill:var(--ink)}
.ctl .big svg{width:26px;height:26px}
.seek{grid-column:1/-1;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.seek span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:20px;margin:0}
@media (max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{display:none}
 .top{display:block;position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:10px 14px}
 .top .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
 .top .row1 img{width:30px;height:30px;border-radius:7px}
 .top .search{margin:0}
 .top .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
 .top .chips button{flex:none;border-radius:999px;background:var(--hover);padding:0 14px;min-height:34px;font-size:13px;font-weight:600}
 .top .chips button.on{background:var(--acc);color:#fff}
 main{padding-top:18px}
 .head{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
 .head .art{max-width:240px}
 .btns{justify-content:center}
 .player{left:0}
 .shelf{grid-auto-columns:minmax(140px,44%)}
}

.np{cursor:pointer}
.full{--w:min(86vw,58vh,560px);position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.5vh,24px);padding:max(18px,env(safe-area-inset-top)) clamp(18px,5vw,40px) max(22px,env(safe-area-inset-bottom));background:#111;color:#fff;overflow:hidden}
.full.on{display:flex;animation:fup .28s ease-out}
@keyframes fup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.full .bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(60px) saturate(140%) brightness(.55);z-index:-1}
.full .close{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:56px;height:36px;display:grid;place-items:center;border-radius:18px}
.full .close:hover{background:rgba(255,255,255,.12)}
.full .close svg{width:26px;height:26px;fill:#fff}
.full .big-art{width:var(--w);aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:#222}
.full .big-art img{width:100%;height:100%;object-fit:cover;display:block}
.full.paused .big-art{transform:scale(.84)}
.full .info{width:var(--w);text-align:left}
.full .info .t{font-size:clamp(20px,2.6vh,26px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .info .s{color:rgba(255,255,255,.7);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.full .seek input{accent-color:#fff}
.full .ctl{gap:clamp(18px,5vw,40px)}
.full .ctl button{width:64px;height:64px}
.full .ctl button:hover{background:rgba(255,255,255,.12)}
.full .ctl svg{width:34px;height:34px;fill:#fff}
.full .ctl .big svg{width:46px;height:46px}
@media (prefers-reduced-motion:reduce){.full.on{animation:none}.full .big-art{transition:none}}
h1,h3,.head h2{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase}
h1{font-size:clamp(30px,4.4vw,40px)}h3{font-size:22px}.head h2{font-size:clamp(28px,4.4vw,40px)}
.nav h4{font-family:var(--cond);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.pill{background:var(--red);border-radius:999px}.pill.alt{background:var(--hover);color:var(--ink)}
.brand{flex-direction:column;align-items:flex-start;gap:2px}
.logo{display:flex;align-items:center;gap:.3em;font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1}
.logo{flex:none}.logo .gw{display:inline-flex;align-items:center;flex:none}.logo img{flex:none}.logo img{height:30px;margin-right:1px;width:auto;border-radius:0}.logo .r{color:var(--acc)}
.brand small{font-family:var(--cond);letter-spacing:.3em;font-size:13px;color:var(--sub);padding-left:2px}
.top .row1 .logo{font-size:20px}.top .row1 .logo img{height:24px;width:auto;border-radius:0}
#bbGate{position:fixed;inset:0;z-index:20000;background:#111111;color:#F4F2EE;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;font-family:var(--body)}
#bbGate[hidden]{display:none}

.lst{display:grid;gap:8px;max-width:640px}

audio.addEventListener("play",()=>{ ppIcon.innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'; mark(); });
audio.addEventListener("pause",()=>{ ppIcon.innerHTML='<path d="M7 4l13 8-13 8z"/>'; mark(); });
audio.addEventListener("ended",()=>{ if(audio.src.startsWith("data:")) return; step(1); });
audio.addEventListener("loadedmetadata",()=>{ len.textContent=fmt(audio.duration); });
audio.addEventListener("timeupdate",()=>{ if(seeking||!audio.duration) return; bar.value=Math.round(audio.currentTime/audio.duration*1000); cur.textContent=fmt(audio.currentTime); });
bar.addEventListener("input",()=>{ seeking=true; if(audio.duration) cur.textContent=fmt(bar.value/1000*audio.duration); });
bar.addEventListener("change",()=>{ if(audio.duration) audio.currentTime=bar.value/1000*audio.duration; seeking=false; });
if("mediaSession" in navigator){ try{ navigator.mediaSession.setActionHandler("nexttrack",()=>step(1)); navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1)); }catch(e){} }

const full=document.getElementById("full"), fArt=document.getElementById("fArt"), fBg=document.getElementById("fBg"), fT=document.getElementById("fT"), fS=document.getElementById("fS"), fBar=document.getElementById("fBar"), fCur=document.getElementById("fCur"), fLen=document.getElementById("fLen"), fIcon=document.getElementById("fIcon");
function syncFull(){ const t=queue[qi]; if(!t) return; const src=COVER[t[1]]||"headphones-lg.jpg"; fArt.src=src; fBg.style.backgroundImage='url("'+src+'")'; fT.textContent=t[0]; fS.textContent=qset?qset.name:"BODYBOX Music"; fLen.textContent=len.textContent; full.classList.toggle("paused",audio.paused); }
function openFull(){ if(!queue.length) return; syncFull(); full.classList.add("on"); document.body.style.overflow="hidden"; document.getElementById("fClose").focus(); }
function closeFull(){ full.classList.remove("on"); document.body.style.overflow=""; }
document.getElementById("fClose").onclick=closeFull;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && full.classList.contains("on")) closeFull(); });
document.querySelector(".np").addEventListener("click",openFull);
document.getElementById("fPP").onclick=()=>document.getElementById("pp").click();
document.getElementById("fPrev").onclick=()=>step(-1);
document.getElementById("fNext").onclick=()=>step(1);
audio.addEventListener("play",()=>{ fIcon.innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'; full.classList.remove("paused"); });
audio.addEventListener("pause",()=>{ fIcon.innerHTML='<path d="M7 4l13 8-13 8z"/>'; full.classList.add("paused"); });
audio.addEventListener("loadedmetadata",()=>{ fLen.textContent=fmt(audio.duration); });
audio.addEventListener("timeupdate",()=>{ if(seeking||!audio.duration) return; fBar.value=Math.round(audio.currentTime/audio.duration*1000); fCur.textContent=fmt(audio.currentTime); });
fBar.addEventListener("input",()=>{ seeking=true; if(audio.duration) fCur.textContent=fmt(fBar.value/1000*audio.duration); });
fBar.addEventListener("change",()=>{ if(audio.duration) audio.currentTime=fBar.value/1000*audio.duration; seeking=false; });
route();
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile, sendEmailVerification, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg = { apiKey:"AIzaSyAMHdGXPgAwPkbdGdcmA538JHBAF_QWAEU", authDomain:"teambodybox-app.firebaseapp.com", projectId:"teambodybox-app", storageBucket:"teambodybox-app.firebasestorage.app", messagingSenderId:"212485533701", appId:"1:212485533701:web:a42605f3fdf0ad6b60ec6c" };
const COACHES = ['reefwtraining@gmail.com','reefwtraining+bodybox@gmail.com'];
const fb = initializeApp(cfg), auth = getAuth(fb), fs = getFirestore(fb);
setPersistence(auth, browserLocalPersistence).catch(()=>{});
const G = document.getElementById('bbGate');
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO = '<div class="glogo"><img class="ghp" src="icon-192.png" alt=""><span class="logo" aria-label="BODY BOX"><span class="gw"><img src="b-mark.png" alt="">ODY</span><span class="gw r"><img src="b-mark-red.png" alt="">OX</span></span><small>MUSIC</small></div>';
const card = h => { G.hidden = false; G.innerHTML = '<div class="gcard">'+LOGO+h+'</div>'; };
const spin = () => card('<div class="gspin"></div>');
const errText = e => { const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return "That email and password don't match.";
  if(c.includes('email-already-in-use')) return 'That email already has an account. Sign in instead.';
  if(c.includes('weak-password')) return 'Use at least 6 characters for your password.';
  if(c.includes('invalid-email')) return 'Check the email address.';
  if(c.includes('too-many-requests')) return 'Too many tries. Wait a minute and try again.';
  if(c.includes('network')) return 'No connection. Check your internet and try again.';
  return 'Something went wrong. Try again.'; };
function showSignIn(msg){
  card('<h2>Sign in</h2><p>BODYBOX Music is for invited members. Use your BODYBOX app login.</p>'+
    '<form id="gIn" class="gcard" style="gap:12px"><label>Email<input id="gEm" type="email" autocomplete="email" required></label>'+
    '<label>Password<input id="gPw" type="password" autocomplete="current-password" required></label>'+
    '<p class="gerr" id="gErr">'+esc(msg)+'</p><button class="gbtn" type="submit">Sign in</button></form>'+
    '<div class="grow"><button class="glink" id="gToUp" type="button">Create an account</button><button class="glink" id="gForgot" type="button">Forgot password</button></div>');
  document.getElementById('gIn').onsubmit = async ev => { ev.preventDefault(); const b=ev.target.querySelector('button'); b.disabled=true;
    try{ await signInWithEmailAndPassword(auth, document.getElementById('gEm').value.trim(), document.getElementById('gPw').value); }
    catch(e){ document.getElementById('gErr').textContent = errText(e); b.disabled=false; } };
  document.getElementById('gToUp').onclick = showSignUp;
  document.getElementById('gForgot').onclick = async () => { const em=document.getElementById('gEm').value.trim(), er=document.getElementById('gErr');
    if(!em){ er.textContent='Type your email above, then tap Forgot password.'; return; }
    try{ await sendPasswordResetEmail(auth, em); er.textContent='Check your email for a link to reset your password.'; }catch(e){ er.textContent=errText(e); } };
}
function showSignUp(){
  card('<h2>Create your account</h2><p>Already on the BODYBOX app? Sign in with that login instead. After you sign up, Coach Reef turns on music for you.</p>'+
    '<form id="gUp" class="gcard" style="gap:12px"><label>Full name<input id="gNm" autocomplete="name" required maxlength="60"></label>'+
    '<label>Email<input id="gEm" type="email" autocomplete="email" required></label>'+
    '<label>Password (6+ characters)<input id="gPw" type="password" autocomplete="new-password" minlength="6" required></label>'+
    '<p class="gerr" id="gErr"></p><button class="gbtn" type="submit">Create account</button></form>'+
    '<div class="grow"><button class="glink" id="gToIn" type="button">I already have an account</button></div>');
  document.getElementById('gUp').onsubmit = async ev => { ev.preventDefault(); const b=ev.target.querySelector('button'); b.disabled=true;
    const nm=document.getElementById('gNm').value.trim();
    try{ const cr=await createUserWithEmailAndPassword(auth, document.getElementById('gEm').value.trim(), document.getElementById('gPw').value);
      try{ await updateProfile(cr.user,{displayName:nm}); }catch(e){}
      try{ await sendEmailVerification(cr.user); }catch(e){}
      await ensureMember(cr.user, nm);
    }catch(e){ document.getElementById('gErr').textContent=errText(e); b.disabled=false; } };
  document.getElementById('gToIn').onclick = () => showSignIn('');
}
async function ensureMember(u, nm){
  const ref = doc(fs,'members',u.uid);
  try{ const s = await getDoc(ref);
    if(!s.exists()) await setDoc(ref,{ name:(nm||u.displayName||'').slice(0,60), email:(u.email||'').toLowerCase(), approved:false, created:serverTimestamp() });
  }catch(e){}
  return ref;
}
function showWaiting(u){
  card('<h2>You\'re in line</h2><p>You\'re signed in as '+esc(u.email)+'. Coach Reef turns on BODYBOX Music for you. This page opens by itself as soon as he does.</p>'+
    '<div class="grow"><button class="glink" id="gOut" type="button">Sign out</button></div>');
  document.getElementById('gOut').onclick = () => signOut(auth);
}
let opened = false, memUnsub = null;
async function openMusic(u, coach){
  if(opened) return;
  try{
    const d = await getDoc(doc(fs,'content','music'));
    if(!d.exists()) throw new Error('nokey');
    const raw = Uint8Array.from(atob(d.data().k), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    window.__bbmKeyResolve(key); opened = true; G.hidden = true; G.innerHTML = '';
    window.__bbmNavExtra && window.__bbmNavExtra(coach, u.email || '');
  }catch(e){
    if(coach) card('<h2>Almost ready</h2><p>The music key isn\'t set up yet. Claude finishes this step.</p><div class="grow"><button class="glink" id="gOut" type="button">Sign out</button></div>');
    else showWaiting(u);
    const o=document.getElementById('gOut'); if(o) o.onclick=()=>signOut(auth);
  }
}
window.__bbmSignOut = () => signOut(auth).then(() => location.reload());
window.__bbmSetKey = async b64 => { await setDoc(doc(fs,'content','music'), { k:b64, at:serverTimestamp() }); return 'saved'; };
window.__bbmListeners = async main => {
  main.innerHTML = '<h1>Who can listen</h1><p style="color:var(--sub);max-width:60ch">Turn music on for the people you want. They sign in here with their BODYBOX app login (or create an account on this page), and it opens for them right away.</p><div class="lst" id="lst"><div class="gspin"></div></div>';
  let snap; try{ snap = await getDocs(collection(fs,'members')); }catch(e){ document.getElementById('lst').textContent = "Couldn't load the member list."; return; }
  const rows = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(m => m.email).sort((a,b) => (b.music===true)-(a.music===true) || String(a.name||a.email).localeCompare(String(b.name||b.email)));
  const lst = document.getElementById('lst');
  lst.innerHTML = rows.map(m => '<div class="lrow"><div class="who"><b>'+esc(m.name||m.email)+'</b><small>'+esc(m.email)+(m.approved && !m.musicOnly ? ' · app member' : ' · music only')+'</small></div><button class="tg" role="switch" aria-checked="'+(m.music===true)+'" aria-label="Music for '+esc(m.name||m.email)+'" data-id="'+m.id+'"></button></div>').join('') || '<p>No accounts yet.</p>';
  lst.onclick = async e => { const t=e.target.closest('.tg'); if(!t) return; const on = t.getAttribute('aria-checked') !== 'true'; t.disabled=true;
    const m = rows.find(x => x.id===t.dataset.id); const upd = { music:on }; if(on && m && m.approved!==true){ upd.approved = true; upd.approvedAt = serverTimestamp(); upd.musicOnly = true; m.approved = true; m.musicOnly = true; }
    try{ await updateDoc(doc(fs,'members',t.dataset.id), upd); t.setAttribute('aria-checked', String(on)); }catch(err){ alert("Couldn't change that. Try again."); }
    t.disabled=false; };
};
onAuthStateChanged(auth, async u => {
  if(memUnsub){ memUnsub(); memUnsub=null; }
  if(!u){ if(opened) location.reload(); else showSignIn(''); return; }
  spin();
  const coach = COACHES.includes((u.email||'').toLowerCase()) && u.emailVerified;
  if(coach){ openMusic(u, true); return; }
  await ensureMember(u);
  memUnsub = onSnapshot(doc(fs,'members',u.uid), s => { const m = s.data()||{}; if(m.music===true && m.approved===true) openMusic(u, false); else if(!opened) showWaiting(u); }, () => showWaiting(u));
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
